# Mises à jour automatiques (PR hebdomadaires) : dépendances npm, actions
# GitHub (y compris les SHA épinglés dans .github/workflows) et image de base
# du Dockerfile. Chaque PR passe par la CI (tests, audit, gitleaks, Trivy).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Africa/Dakar
    open-pull-requests-limit: 10
    groups:
      correctifs-npm:
        update-types: [minor, patch]
    labels: [dependances]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Africa/Dakar
    groups:
      actions:
        patterns: ["*"]
    labels: [dependances, ci]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Africa/Dakar
    labels: [dependances, docker]
