name: CI

on:
  push:
    branches: [main]
  pull_request:

# Moindre privilège : jeton GITHUB_TOKEN en lecture seule par défaut ; chaque
# job n'élargit que ce dont il a besoin.
permissions:
  contents: read

# Une nouvelle poussée sur la même branche / PR annule l'exécution obsolète.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Actions épinglées par SHA de commit (le tag entre commentaires est indicatif,
# Dependabot met à jour les deux). SHA relevés avec `git ls-remote --tags`.
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gestion_imo_test
          POSTGRES_USER: imo
          POSTGRES_PASSWORD: imo_ci_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U imo -d gestion_imo_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: gestion_imo_test
      DB_USER: imo
      DB_PASSWORD: imo_ci_password
      JWT_SECRET: ci-jwt-secret-uniquement-pour-les-tests-0123456789
      JWT_REFRESH_SECRET: ci-refresh-secret-uniquement-pour-les-tests-9876543210
      INVITATION_SECRET: ci-invitation-secret
      APP_ENC_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      API_PUBLIC_URL: http://localhost:3000
      APP_PUBLIC_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vérification syntaxique
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Tests unitaires, API, sécurité, PostgreSQL, concurrence et E2E (avec couverture)
        run: npx jest --coverage --randomize
        env:
          JEST_WORKERS: 2
      - name: Couverture des routes (toutes les routes de l'API doivent être appelées)
        run: npm run test:routes
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: couverture
          path: coverage/

  # Barrière : aucune vulnérabilité connue de gravité ≥ moderate dans les
  # dépendances de PRODUCTION.
  audit-dependances:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Audit des dépendances de production
        run: npm audit --omit=dev --audit-level=moderate
      - name: Scripts shell de déploiement (syntaxe + shellcheck, niveau erreur)
        run: |
          for f in deploy/*.sh; do bash -n "$f"; done
          sh -n docker-entrypoint.sh
          shellcheck -x -S error deploy/*.sh docker-entrypoint.sh

  # Recherche de secrets dans tout l'historique git.
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Compte d'organisation : licence gratuite à demander sur gitleaks.io,
          # puis à enregistrer comme secret GITLEAKS_LICENSE.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_COMMENTS: false

  # Construction de l'image de production puis analyse Trivy (OS + npm).
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Construction de l'image
        run: docker build --pull -t gestion-imo-api:ci-${{ github.sha }} .
      - name: Analyse Trivy (échec sur CRITICAL/HIGH corrigeables)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: gestion-imo-api:ci-${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: "1"

  # ── Déploiement sur le VPS ──────────────────────────────────────────────────
  # Ne démarre que si TOUTES les barrières ci-dessus sont vertes : tests et
  # couverture des routes, audit des dépendances de production, recherche de
  # secrets dans l'historique, et analyse Trivy de l'image. Un commit qui
  # échoue sur l'une d'elles n'atteint jamais le serveur.
  #
  # Le déploiement est placé ici plutôt que dans un workflow séparé pour ne pas
  # rejouer ces barrières une seconde fois : la suite avec couverture et la
  # construction de l'image coûtent déjà plusieurs minutes.
  #
  # Secrets à configurer UNE FOIS dans ce dépôt
  # (Settings → Secrets and variables → Actions) :
  #   VPS_HOST     adresse du serveur (IP ou nom de domaine)
  #   VPS_USER     utilisateur SSH
  #   VPS_SSH_KEY  clé privée SSH, dont la publique est dans
  #                ~/.ssh/authorized_keys de cet utilisateur sur le VPS
  deploiement:
    needs: [tests, audit-dependances, secrets, image]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production

    # Le `concurrency` du workflow annule l'exécution obsolète
    # (cancel-in-progress: true) — bon pour des tests, dangereux pour un
    # déploiement : couper un `docker compose up --build` en cours laisserait
    # le conteneur à moitié recréé. Ce job a donc sa propre file, sans
    # annulation : deux poussées rapprochées déploient l'une après l'autre.
    concurrency:
      group: deploiement-kerimmo
      cancel-in-progress: false

    steps:
      - name: Déployer par SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # La construction de l'image (apt, npm ci, npm rebuild bcrypt)
          # dépasse les 10 minutes par défaut de l'action, ce qui couperait la
          # connexion SSH avant la fin — un échec signalé alors que l'image
          # finit de se construire.
          command_timeout: "30m"
          script: |
            set -e

            APP_DIR="/var/www/kerimmo-api"
            COMPOSE="docker compose -f docker-compose.prod.yml"
            DOMAINE="api.kerimmo.kodafrik.com"
            SITE="kerimmo-api"

            # Le dépôt est cloné une première fois à la main, avec son .env
            # rempli. Ce workflow ne fait que le mettre à jour : cloner ici
            # masquerait une erreur de chemin derrière un déploiement en
            # apparence réussi.
            if [ ! -d "${APP_DIR}/.git" ]; then
              echo "ERREUR : ${APP_DIR} n'est pas un dépôt git." >&2
              echo "Premier déploiement : 'git clone <url> ${APP_DIR}' une fois, à la main." >&2
              exit 1
            fi

            cd "${APP_DIR}"

            # .env n'est jamais commité : il porte les secrets JWT, les deux
            # jeux d'identifiants PostgreSQL, le mot de passe Redis et la clé
            # de chiffrement au repos. Sans lui, `up` échoue sur les `${VAR:?}`
            # du compose — autant le dire ici, avec la marche à suivre.
            if [ ! -f ".env" ]; then
              echo "ERREUR : ${APP_DIR}/.env manquant — copier .env.example et le remplir." >&2
              echo "Les secrets se génèrent avec : npm run secrets:generer" >&2
              exit 1
            fi

            # Un `git pull` refuse de tourner sur un arbre sale. Le cas le plus
            # courant n'est pas une édition : un `chmod +x` sur un script de
            # deploy/ suffit, git suivant le bit d'exécution. On le dit, avec
            # la marche à suivre, plutôt que d'écraser en silence un travail
            # laissé sur le serveur.
            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "ERREUR : modifications non commitées dans ${APP_DIR} :" >&2
              git status --short >&2
              echo "" >&2
              echo "Pour les abandonner : git -C ${APP_DIR} checkout -- ." >&2
              echo "Si ce sont des changements de permissions seulement :" >&2
              echo "  git -C ${APP_DIR} config core.fileMode false" >&2
              exit 1
            fi

            git pull --rebase origin main

            # Sauvegarde AVANT de toucher au schéma : l'entrypoint applique les
            # migrations au démarrage du conteneur, et une migration ne se
            # défait pas toujours. Un échec de sauvegarde avertit sans bloquer
            # — refuser de déployer un correctif urgent parce que la sauvegarde
            # a échoué serait pire.
            bash deploy/backup-postgres.sh || echo "AVERTISSEMENT : sauvegarde préalable impossible."

            # Seul le backend est reconstruit : PostgreSQL, Redis et leurs
            # volumes restent intacts.
            #
            # Les migrations ne sont pas lancées ici : docker-entrypoint.sh
            # attend la base, applique les migrations avec le PROPRIÉTAIRE du
            # schéma, rejoue les données de référence, puis démarre l'API avec
            # le rôle à privilèges minimaux. Une migration en échec empêche le
            # conteneur de démarrer, au lieu de laisser l'API servir du trafic
            # sur un schéma périmé.
            # Construire D'ABORD, remplacer le conteneur ENSUITE.
            #
            # `up -d --build` fait les deux d'un seul geste, et c'est ce qui a
            # fait échouer le déploiement : la construction (npm ci, npm rebuild
            # bcrypt, export de l'image) occupe la machine plusieurs minutes,
            # les sondes de postgres et de redis dépassent leur délai pendant ce
            # temps, et `up` refuse alors de démarrer le backend —
            # « dependency failed to start: … redis-1 is unhealthy » — alors que
            # Redis répondait avant et répond encore après.
            ${COMPOSE} build backend

            # Dépendances alignées sur le fichier compose puis attendues
            # (recréées une fois si besoin, diagnostic affiché en cas d'échec) :
            # voir l'en-tête de deploy/attendre-dependances.sh.
            bash deploy/attendre-dependances.sh postgres redis

            # `--no-deps` : leur santé vient d'être vérifiée, avec de la
            # patience. La condition `depends_on` du compose, elle, n'en a pas.
            ${COMPOSE} up -d --no-build --no-deps --force-recreate --remove-orphans backend

            # On sonde l'état réel du conteneur plutôt qu'un délai fixe : le
            # HEALTHCHECK a 40 s de start-period et les migrations peuvent
            # durer. 60 tentatives × 5 s = 5 minutes.
            echo "Attente du démarrage (migrations et données de référence incluses)…"
            etat="absent"
            for i in $(seq 1 60); do
              cid="$(${COMPOSE} ps -q backend 2>/dev/null || true)"
              if [ -z "$cid" ]; then
                echo "Le conteneur n'est plus lancé — journaux :"
                ${COMPOSE} logs --tail=80 backend
                exit 1
              fi
              etat="$(docker inspect -f '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo absent)"
              [ "$etat" = "healthy" ] && break
              sleep 5
            done

            if [ "$etat" != "healthy" ]; then
              echo "Conteneur non healthy après 300 s — journaux :"
              ${COMPOSE} logs --tail=80 backend
              exit 1
            fi

            # Le port publié sur l'hôte est réglable (HOST_PORT) : le lire
            # plutôt que le supposer, sinon la sonde interroge l'application du
            # voisin sur un serveur qui en héberge plusieurs.
            PORT_HOTE="$(grep -E '^HOST_PORT=' .env | tail -1 | cut -d= -f2 | tr -dc '0-9')"
            PORT_HOTE="${PORT_HOTE:-3000}"

            echo "Contrôle local sur 127.0.0.1:${PORT_HOTE}…"
            curl -fsS "http://127.0.0.1:${PORT_HOTE}/health" >/dev/null
            echo "API en ligne."

            # ── Configuration nginx ─────────────────────────────────────────
            # Posée ici pour qu'une modification de deploy/nginx.conf prenne
            # effet sans intervention manuelle : sans cette étape, le fichier
            # arrive bien par le `git pull` ci-dessus, mais nginx ne lit que
            # /etc/nginx — un correctif resterait invisible en production
            # alors que le déploiement passerait au vert.
            #
            # Le danger est réel : ce serveur sert plusieurs domaines, et une
            # configuration invalide empêche de recharger TOUS les sites de la
            # machine, renouvellement des certificats compris. D'où la
            # sauvegarde, le test, et la restauration AVANT d'échouer — nginx
            # n'est jamais rechargé avec une configuration qui n'a pas passé
            # `nginx -t`.
            DISPO="/etc/nginx/sites-available/${SITE}"
            SAUVE="/root/${SITE}.nginx.avant-deploiement"

            if [ ! -f "/etc/letsencrypt/live/${DOMAINE}/fullchain.pem" ]; then
              # deploy/nginx.conf référence les certificats : les poser avant
              # Certbot ferait échouer `nginx -t`. Le premier passage se fait
              # à la main avec deploy/nginx-http.conf (voir son en-tête).
              echo "Certificat absent pour ${DOMAINE} — configuration nginx laissée telle quelle."
              echo "Premier déploiement : poser deploy/nginx-http.conf puis lancer certbot."
            else
              [ -f "${DISPO}" ] && cp "${DISPO}" "${SAUVE}"

              # Le fragment de proxy d'abord : nginx.conf l'inclut, et son
              # absence ferait échouer le test.
              mkdir -p /etc/nginx/snippets
              cp "${APP_DIR}/deploy/nginx-proxy.conf" /etc/nginx/snippets/gestion-imo-proxy.conf

              cp "${APP_DIR}/deploy/nginx.conf" "${DISPO}"
              sed -i "s/api\.exemple\.sn/${DOMAINE}/g" "${DISPO}"
              sed -i "s|server 127\.0\.0\.1:3000;|server 127.0.0.1:${PORT_HOTE};|" "${DISPO}"
              ln -sf "${DISPO}" "/etc/nginx/sites-enabled/${SITE}"

              if nginx -t; then
                systemctl reload nginx
                echo "Configuration nginx à jour et rechargée."
              else
                echo "ERREUR : nginx -t a échoué avec la nouvelle configuration." >&2
                if [ -f "${SAUVE}" ]; then
                  cp "${SAUVE}" "${DISPO}"
                  echo "Configuration précédente restaurée." >&2
                else
                  rm -f "/etc/nginx/sites-enabled/${SITE}"
                  echo "Site désactivé (aucune version précédente à restaurer)." >&2
                fi
                nginx -t
                exit 1
              fi
            fi

            echo "Déploiement terminé."

      - name: Vérifier l'API publique
        # Contrôle de bout en bout : DNS, nginx, certificat, puis application.
        # Le contrôle précédent tournait sur le serveur, en loopback — il ne
        # dit rien de ce que voient les clients.
        #
        # `/health/live` et non `/health` : deploy/nginx.conf réserve `/health`
        # et `/health/ready` à 127.0.0.1, parce qu'elles révèlent l'état de la
        # base, du stockage et de Redis. Depuis un runner GitHub, `/health`
        # répond 403 — ce job echouait donc a chaque deploiement reussi.
        run: |
          set -e
          url="https://api.kerimmo.kodafrik.com/health/live"
          code=$(curl -sS -m 30 -o /dev/null -w '%{http_code}' "$url")
          echo "$url -> $code"
          [ "$code" = "200" ] || { echo "::error::l'API publique répond $code"; exit 1; }
          echo "API publique vérifiée."
