# ============================================================================
#  Gestion Immo API — nginx PROVISOIRE, le temps d'obtenir le certificat.
#
#  deploy/nginx.conf référence /etc/letsencrypt/live/<domaine>/fullchain.pem,
#  qui n'existe pas avant le premier passage de Certbot : le poser trop tôt
#  fait échouer `nginx -t`. Et comme un seul fichier invalide empêche de
#  recharger TOUS les sites de la machine, cela coupe aussi les autres
#  domaines servis par ce serveur et le renouvellement de leurs certificats.
#
#  Installation (une seule fois, au premier déploiement) :
#    sudo cp deploy/nginx-http.conf /etc/nginx/sites-available/kerimmo-api
#    sudo sed -i "s/api.exemple.sn/api.kerimmo.kodafrik.com/g" \
#             /etc/nginx/sites-available/kerimmo-api
#    sudo ln -sf /etc/nginx/sites-available/kerimmo-api /etc/nginx/sites-enabled/
#    sudo mkdir -p /var/www/certbot
#    sudo nginx -t && sudo systemctl reload nginx
#    sudo certbot certonly --webroot -w /var/www/certbot -d api.kerimmo.kodafrik.com
#
#  Puis seulement, poser deploy/nginx.conf (TLS, limitation de débit, en-têtes
#  de sécurité) — ce que le déploiement continu fait ensuite tout seul.
#
#  `certonly --webroot` et non `--nginx` : Certbot ne doit pas réécrire la
#  configuration, ses options TLS par défaut entreraient en conflit avec le
#  profil de deploy/nginx.conf. Le dossier /var/www/certbot est servi par le
#  bloc ci-dessous, et il l'est aussi par deploy/nginx.conf : les
#  renouvellements fonctionnent donc sans interruption de service.
# ============================================================================

server {
    listen 80;
    server_name api.exemple.sn;
    server_tokens off;

    # Validation ACME (émission et renouvellement).
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }

    # Pas de proxy ici : à ce stade l'API n'est pas forcément lancée, et ce
    # fichier n'a qu'un seul rôle — permettre à Certbot de prouver que le
    # domaine est bien servi par cette machine.
    location / { return 404; }
}
