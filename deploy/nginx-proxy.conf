# Paramètres de proxy communs à tous les blocs location de deploy/nginx.conf.
# À copier dans /etc/nginx/snippets/gestion-imo-proxy.conf.
# Ne pas y mettre de add_header / proxy_hide_header / limit_req : ils
# annuleraient l'héritage des directives du bloc server.
proxy_pass http://gestion_imo_api;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 120s;
