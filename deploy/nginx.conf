# ============================================================================
#  Gestion Immo API — nginx (terminaison TLS, proxy vers 127.0.0.1:3000).
#  Installation : docs/EXPLOITATION.md § « Mise en place du serveur ».
#    sudo cp deploy/nginx.conf /etc/nginx/sites-available/gestion-imo
#    sudo cp deploy/nginx-proxy.conf /etc/nginx/snippets/gestion-imo-proxy.conf
#  Certificats : `certbot certonly --nginx -d api.exemple.sn` (certonly : certbot
#  ne doit PAS réécrire ce fichier ; ses options TLS par défaut entreraient en
#  conflit avec le profil ci-dessous).
#  Toute modification : `sudo nginx -t && sudo systemctl reload nginx`.
# ============================================================================

# ── Limitation de débit (en plus de celle de l'API, stockée dans Redis) ──────
# Zone générale : toutes les routes.
limit_req_zone $binary_remote_addr zone=api_par_ip:10m rate=30r/s;
# Zone stricte : authentification (connexion, OTP, mot de passe oublié…).
limit_req_zone $binary_remote_addr zone=auth_par_ip:10m rate=5r/s;
# Connexions simultanées : téléversements (corps jusqu'à 70 Mo).
limit_conn_zone $binary_remote_addr zone=televersement_par_ip:10m;
limit_req_status 429;
limit_conn_status 429;

# Connexions amont réutilisées ; Node les garde 65 s (> 60 s par défaut ici) :
# pas de 502 sur une connexion fermée côté Node.
upstream gestion_imo_api {
    server 127.0.0.1:3000;
    keepalive 32;
    keepalive_timeout 60s;
}

server {
    listen 80;
    server_name api.exemple.sn;
    server_tokens off;
    # Renouvellement Let's Encrypt (méthode webroot) possible sans passer en HTTPS.
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name api.exemple.sn;
    server_tokens off;

    # ── TLS : profil « intermediate » de Mozilla (ssl-config.mozilla.org) ────
    ssl_certificate     /etc/letsencrypt/live/api.exemple.sn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.exemple.sn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    # Suites TLS 1.2 AEAD à secret persistant (ECDHE) uniquement ; les suites
    # DHE du profil sont omises (elles exigeraient un ssl_dhparam dédié et
    # n'apportent rien aux clients mobiles/navigateurs actuels).
    # TLS 1.3 : suites par défaut d'OpenSSL (toutes conformes).
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    # Profil intermediate : toutes les suites sont sûres, le client choisit
    # (ChaCha20 sur mobile sans AES matériel).
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:GestionImoTLS:10m;
    # Les tickets de session affaiblissent la confidentialité persistante (clé
    # de ticket rarement renouvelée par nginx) : désactivés.
    ssl_session_tickets off;

    # OCSP stapling. NB : Let's Encrypt a cessé son service OCSP (2025) : avec
    # un certificat LE, nginx journalise « no OCSP responder URL » et ignore
    # simplement ces directives (sans effet de bord). Elles restent utiles si le
    # certificat provient d'une autorité qui publie encore un répondeur OCSP.
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/api.exemple.sn/chain.pem;
    resolver 1.1.1.1 9.9.9.9 valid=300s;
    resolver_timeout 5s;

    # ── En-têtes ─────────────────────────────────────────────────────────────
    # HSTS : nginx est la SEULE source. helmet (src/app.js) l'émet aussi en
    # production ; l'en-tête amont est masqué pour éviter un doublon (et toute
    # divergence de valeur entre les deux couches).
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    # (Les autres en-têtes de sécurité — CSP, Referrer-Policy, CORP,
    # Permissions-Policy… — sont posés par l'API et transmis tels quels.)

    # ── Corps de requête ────────────────────────────────────────────────────
    # Par défaut 1 Mo : l'API JSON plafonne elle-même à 256 ko
    # (express.json) ; seules les routes de téléversement ont davantage.
    client_max_body_size 1m;
    client_body_timeout 60s;

    # Limitation générale (héritée par les blocs location qui ne redéfinissent
    # pas limit_req).
    limit_req zone=api_par_ip burst=60 nodelay;

    location / {
        include snippets/gestion-imo-proxy.conf;
    }

    # ── Authentification : limitation stricte en plus de la générale ─────────
    location ^~ /api/v1/auth/ {
        limit_req zone=api_par_ip burst=60 nodelay;
        limit_req zone=auth_par_ip burst=10 nodelay;
        include snippets/gestion-imo-proxy.conf;
    }

    # ── Téléversements (multipart, middleware recevoirFichier) ──────────────
    # Liste tirée de `grep -rn "recevoirFichier" src/modules --include=*.route.js`
    # et des montages de src/routes.js. À TENIR À JOUR si une route multipart
    # est ajoutée (sinon elle sera refusée par nginx en 413 au-delà de 1 Mo).
    # Plafonds applicatifs : UPLOAD_MAX_IMAGE_MB=10, UPLOAD_MAX_DOCUMENT_MB=15,
    # UPLOAD_MAX_VIDEO_MB=60 (.env) — ajuster ici s'ils changent.
    #
    # Pièces d'incident côté locataire (photos ET vidéos) : 60 Mo + marge multipart.
    location ~ ^/api/v1/locataire/incidents/[^/]+/pieces$ {
        client_max_body_size 70m;
        limit_conn televersement_par_ip 2;
        include snippets/gestion-imo-proxy.conf;
    }
    # Images et justificatifs (image ou PDF) : 15 Mo max + marge multipart.
    #   /documents (POST /)                         → document
    #   /cautions/:id/justificatifs                 → justificatif
    #   /depenses/:id/justificatifs                 → justificatif
    #   /factures-communes/:id/document             → justificatif
    #   /etats-des-lieux/:id/elements/:itemId/photos → image
    #   /travaux/:id/photos                         → image
    #   /messagerie/locataires/:tenantId/photos     → image
    #   /locataire/messagerie/:threadId/photos      → image
    #   /locataire/paiements/preuves                → justificatif
    location ~ ^/api/v1/(documents/?|cautions/[^/]+/justificatifs|depenses/[^/]+/justificatifs|factures-communes/[^/]+/document|etats-des-lieux/[^/]+/elements/[^/]+/photos|travaux/[^/]+/photos|messagerie/locataires/[^/]+/photos|locataire/messagerie/[^/]+/photos|locataire/paiements/preuves)$ {
        client_max_body_size 20m;
        limit_conn televersement_par_ip 2;
        include snippets/gestion-imo-proxy.conf;
    }

    # ── Sondes ───────────────────────────────────────────────────────────────
    # /health/live : publique (le processus répond, sans détail interne).
    location = /health/live {
        include snippets/gestion-imo-proxy.conf;
    }
    # /health et /health/ready révèlent l'état de la base, du stockage et de
    # Redis : réservées à l'hôte (deploy.sh et le HEALTHCHECK Docker
    # interrogent directement 127.0.0.1:3000, sans passer par nginx).
    location = /health {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        include snippets/gestion-imo-proxy.conf;
    }
    location = /health/ready {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        include snippets/gestion-imo-proxy.conf;
    }

    # /metrics n'est jamais exposé publiquement.
    location = /metrics { deny all; }
}
