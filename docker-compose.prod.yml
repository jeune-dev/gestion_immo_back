# ============================================================
#  Gestion Immo API — Docker Compose PRODUCTION (VPS)
#  Première installation : docker compose -f docker-compose.prod.yml up -d --build
#  Mises à jour : bash deploy/deploy.sh (construit AVANT de toucher à la pile,
#  et attend les dépendances — voir deploy/attendre-dependances.sh).
#  Prérequis : .env rempli (voir .env.example), nginx + Let's Encrypt sur l'hôte.
# ============================================================
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      # Propriétaire du schéma (migrations au démarrage SEULEMENT). L'API se
      # connecte avec DB_USER, rôle à privilèges minimaux créé par
      # src/scripts/rolesBase.js (constat M5 de l'audit).
      POSTGRES_USER: ${DB_ADMIN_USER:?DB_ADMIN_USER requis dans .env}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?DB_ADMIN_PASSWORD requis dans .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - gestion_imo_pg:/var/lib/postgresql/data
    expose: ["5432"]
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    # Délais volontairement larges : la sonde doit détecter une base MORTE, pas
    # une base LENTE. Sur un VPS modeste, une construction d'image sature la
    # machine et `pg_isready` dépasse facilement 5 s — déclaré « unhealthy »,
    # le service fait échouer le déploiement alors qu'il répond très bien.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_ADMIN_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
    deploy: { resources: { limits: { memory: 768M } } }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Mot de passe obligatoire (défense en profondeur : un conteneur compromis du
    # réseau Docker ne lit ni n'efface les compteurs). volatile-lru : seules les
    # clés AVEC expiration sont évincées sous pression mémoire (cache) ; une
    # clé sans TTL n'est jamais évincée. Les compteurs de limitation ont un TTL
    # (fenêtre) : surveiller used_memory pour qu'ils ne soient pas évincés.
    #
    # `--save ''` : aucune sauvegarde sur disque. Ce Redis ne contient que des
    # compteurs de limitation de débit et du cache (config/redis.js) — rien à
    # conserver d'un redémarrage à l'autre. Avec les règles de sauvegarde par
    # défaut, redis `fork()` pour écrire son instantané et la copie-sur-écriture
    # peut doubler sa mémoire : sous la limite de 160M, le gestionnaire de
    # mémoire tue alors le conteneur au pire moment.
    #
    # maxmemory 96mb (et non 128) pour laisser de la marge sous cette limite :
    # dépassée, le conteneur est tué, alors que `volatile-lru` ne fait
    # qu'évincer des clés de cache expirables.
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --save '' --maxmemory 96mb --maxmemory-policy volatile-lru"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD requis dans .env}
    expose: ["6379"]
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    # Mêmes délais larges que postgres, pour la même raison : c'est cette sonde
    # qui, déclarée en échec pendant une construction d'image, a fait échouer le
    # déploiement sur « dependency failed to start: … redis-1 is unhealthy ».
    healthcheck:
      # REDISCLI_AUTH : le mot de passe n'apparaît pas dans la ligne de commande.
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
    deploy: { resources: { limits: { memory: 160M } } }

  backend:
    build: .
    image: gestion-imo-api:latest
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      LOG_DIR: /app/logs
      UPLOAD_DIR: /app/uploads
    # Seul nginx (sur l'hôte) y accède.
    #
    # Le port hôte est réglable par `HOST_PORT` (.env) parce qu'un VPS héberge
    # souvent plusieurs API : figé, `up` échoue sur « port is already
    # allocated » dès qu'une autre application occupe 3000, et modifier ce
    # fichier à la main fait ensuite échouer le `git pull` du déploiement. Le
    # port INTERNE reste 3000 — chaque conteneur a son propre espace réseau,
    # deux applications peuvent y écouter sur 3000 sans se gêner. Penser à
    # aligner l'`upstream` de deploy/nginx.conf sur la même valeur.
    ports: ["127.0.0.1:${HOST_PORT:-3000}:3000"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - gestion_imo_uploads:/app/uploads
      - gestion_imo_logs:/app/logs
    logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }
    deploy: { resources: { limits: { memory: 768M }, reservations: { memory: 128M } } }

volumes:
  gestion_imo_pg:
  gestion_imo_uploads:
  gestion_imo_logs:
